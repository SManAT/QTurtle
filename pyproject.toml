# Usage: 
#   pip install -e .

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6-template"
version = "1.0.0"
description = "A Qt6 application"
readme = "README.md"
authors = [
    {name = "Mag. Stefan Hagmann"},
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["pyside6", "gui", "desktop"]

dependencies = [
    "pyside6-essentials>=6.4.0",
    "svg_turtle",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pyside6-tools>=6.4.0",  # For Qt Designer and pyside6-uic
    "build",
    "wheel",
    "pyinstaller>=6.0.0",
]
briefcase = [
    "briefcase>=0.3.0",
]

[tool.setuptools]

# PyInstaller configuration -----------------------------------------------------------
[tool.qturtle_app.build]
app_name = "QTurtle"
app_module = "src/main.py"
icon = "src/assets/app.ico"
data_files = [
    "src/qturtle_app",
]
output_dir = "dist"
build_mode = "onedir"  # onedir or onefile
clean = true
noconfirm = true
windowed = true
# modules that we need in the project > min output
hidden_imports = [
    "turtle",
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtWidgets",
    "PySide6.QtPrintSupport",
    "qturtle_app.editor",
    "qturtle_app.runner",
    "qturtle_app.svg_turtle_class",
    "qturtle_app.ui.Ui_MainWindow",
]
collect_all = ["tkinter"]  # pulls in _tkinter.pyd + Tcl/Tk DLLs needed by turtle subprocesses
include_python_interpreter = true  # bundle python.exe into _internal/ for subprocess script execution
strip = true   # Strip debug symbols (Unix only, ignored on Windows)
upx = true     # UPX compression: true = use if upx in PATH, false = --noupx
upx_dir = "C:/upx"  # Path to upx.exe directory (optional, if not in PATH)
# DLLs that UPX cannot compress on Windows — add more if you see "Failed to upx" warnings
upx_exclude = [
    "python.exe",
    "pythonw.exe",
    "python3.dll",
    "python312.dll",
    "python313.dll",
    "vcruntime140.dll",
    "vcruntime140_1.dll",
    "msvcp140.dll",
]
# dont use PyQT6, exclude large unused packages to minimize output size
exclude_modules = [
    "PyQt6",
    "pyqt6",
    "matplotlib",
    "scipy",
    "numpy",
    "pandas",
    "PIL",
    "wx",
    "IPython",
    "jupyter",
    "notebook",
    "test",
    "unittest",
    "doctest",
    "pydoc",
    "xmlrpc",
    "ftplib",
    "poplib",
    "imaplib",
    "smtplib",
    "http.server",
]
log_level = "WARN"

# Briefcase configuration -------------------------------------------------------------
[tool.briefcase]
project_name = "QTurtle"
bundle = "org.qturtle"
version = "0.1.0"
url = "https://github.com/stefanhag/QTurtle"
license = "GPL-3.0-or-later"
author = "Mag. Stefan Hagmann"
author_email = "sman@mailbox.org"

[tool.briefcase.app.qturtle_app]
formal_name = "QTurtle"
description = "Python IDE for running turtle graphics scripts"
sources = ["src/qturtle_app"]
requires = ["pyside6-essentials>=6.4.0"]
icon = "src/assets/app"
license-files = ["LICENSE"]

[tool.briefcase.app.qturtle_app.windows]
requires = [
    "pyside6-essentials>=6.4.0",
    "svg-turtle>=1.0.0",
]
system_installer = true

