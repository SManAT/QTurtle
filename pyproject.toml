# Usage: 
#   Normal Install: pip install -e .
#   Build: python -m build
# be sure setuptools and build are in latest version
# pip install --upgrade setuptools build

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6-template"
version = "1.0.0"
description = "A Qt6 application"
readme = "README.md"
authors = [
    {name = "Mag. Stefan Hagmann"},
]
license = {text = "GPL-3.0-or-later"}
keywords = ["pyside6", "gui", "desktop"]

dependencies = [
    "pyside6>=6.4.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pyqt6-tools",  # Move to optional - often causes issues
    "build",
    "wheel",
]

[tool.setuptools]
license-files = ["LICENSE", "LICENSE.rtf"]

# PyInstaller configuration -----------------------------------------------------------
[tool.qturtle.build]
app_name = "QTurtle"
app_module = "src/qturtle/__main__.py"
icon = "assets/app.ico"
data_files = [
    "src/qturtle/css",
    "src/qturtle/ui",
]
output_dir = "dist"
build_mode = "onedir"  # onedir or onefile
clean = true
noconfirm = true
windowed = true
hidden_imports = [
    "turtle",
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtWidgets",
]
collect_all = [
    "PySide6",
]

# Briefcase configuration -------------------------------------------------------------
[tool.briefcase]
project_name = "QTurtle"
bundle = "org.qturtle"
version = "0.1.0"
url = "https://github.com/stefanhag/QTurtle"
license = "GPL-3.0-or-later"
author = "Mag. Stefan Hagmann"
author_email = "sman@mailbox.org"

[tool.briefcase.app.qturtle]
formal_name = "QTurtle"
description = "Python IDE for running turtle graphics scripts"
sources = ["src/qturtle"]
requires = ["pyside6>=6.4.0"]
icon = "assets/app"
resources = ["LICENSE.rtf"]

[tool.briefcase.app.qturtle.windows]
requires = [
    "pyside6>=6.4.0",
]
system_installer = true

